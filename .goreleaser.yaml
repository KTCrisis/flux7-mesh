version: 2

project_name: mesh7

before:
  hooks:
    - go mod tidy

# sdk-v* tags version the Python SDK, not the binaries.
git:
  ignore_tags:
    - "sdk-v*"

builds:
  - id: mesh7
    main: ./cmd/mesh7
    binary: mesh7
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
  # The approval CLI ships with the proxy: without it a human has no
  # terminal way to answer the approvals mesh7 asks for.
  - id: mesh
    main: ./cmd/mesh
    binary: mesh
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - ids: [mesh7, mesh]
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # No version in the name, so releases/latest/download/<name> always
    # resolves without asking the GitHub API which version is latest.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: KTCrisis
    name: flux7-mesh
  replace_existing_artifacts: true
